description: >
  Interactive new-employee onboarding for Ninja Van. A hub of guided
  walkthrough modules that replaces static slide decks; the first module covers
  the IT Policy — account and password rules, acceptable use of company
  equipment, damage liability, and incident reporting — with inline interactive
  elements (password checker, inactivity timeline, lost-device stepper, incident
  matrix). Progress is stored in the browser. For new Ninja Van employees.

# No database: this iteration keeps all progress in the browser's localStorage.
